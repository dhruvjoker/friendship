{% extends "base_neon.html" %}
{% block title %}Reset Password — Friendship Circle{% endblock %}
{% block content %}
<div class="auth-card">
  <h2>Choose a new password</h2>
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
    <input type="password" name="password" placeholder="New password (min 4 characters)" minlength="4" required class="form-input">
    <button type="submit" class="btn-primary">Reset password</button>
  </form>
</div>
{% endblock %}
